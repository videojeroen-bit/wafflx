<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wafflx Admin - FINAL FIX</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 900px; margin: auto; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .prod-group { border: 1px solid #f1c40f; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #252525; }
        .row { display: flex; gap: 10px; margin-bottom: 5px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; margin-top: 5px; }
        .btn-save { background: #2ecc71; color: white; width: 100%; font-size: 1.5rem; padding: 20px; margin-top: 20px; }
        .btn-add { background: #f1c40f; color: black; }
        h3 { color: #f1c40f; margin-top: 15px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

<div class="card">
    <h1>🛠 Wafflx Beheer</h1>
    <div class="row">
        <div style="flex:1"><label>WhatsApp Nummer:</label><input type="text" id="telefoon"></div>
        <div style="flex:1"><label>IBAN:</label><input type="text" id="iban"></div>
    </div>
    <div class="row">
        <div style="flex:1"><label>Email Bakker:</label><input type="text" id="email_instelling"></div>
        <div style="flex:1"><label>Winkel Naam:</label><input type="text" id="winkel_naam"></div>
    </div>

    <hr>
    <div id="assortiment-cont"></div>
    <button class="btn-add" onclick="voegGroep()">+ NIEUWE PRODUCTGROEP</button>

    <button class="btn-save" onclick="secureSave()">💾 NU OPSLAAN</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const config = { databaseURL: "https://wafflx-default-rtdb.europe-west1.firebasedatabase.app" };[cite: 1]
    firebase.initializeApp(config);
    const db = firebase.database().ref('/');
    
    const SLEUTEL = "gamingopanl"; 
    let localData = { instellingen: {}, assortiment: [] };

    db.on('value', snap => {
        const d = snap.val();
        if(d) {
            localData = d;
            document.getElementById('telefoon').value = d.instellingen.telefoon || "";
            document.getElementById('iban').value = d.instellingen.rekeningnr || "";
            document.getElementById('email_instelling').value = d.instellingen.email || "";
            document.getElementById('winkel_naam').value = d.instellingen.winkel || "";
            render();
        }
    });

    function render() {
        const cont = document.getElementById('assortiment-cont');
        cont.innerHTML = '';
        (localData.assortiment || []).forEach((cat, cIdx) => {
            let html = `<div class="prod-group">
                <input type="text" value="${cat.categorie}" oninput="localData.assortiment[${cIdx}].categorie=this.value" style="font-weight:bold;">
                <h3>Maten & Prijzen</h3>
                <div id="maten-${cIdx}">${renderItems(cat.maten, cIdx, 'maten')}</div>
                <button class="btn-add" onclick="addItem(${cIdx}, 'maten')">+ Maat</button>
                <br><br>
                <button style="background:#e74c3c; color:white;" onclick="localData.assortiment.splice(${cIdx},1);render()">🗑 GROEP WEG</button>
            </div>`;
            cont.innerHTML += html;
        });
    }

    function renderItems(items, cIdx, type) {
        return (items || []).map((item, i) => `
            <div class="row">
                <input type="text" value="${item.naam}" oninput="localData.assortiment[${cIdx}].${type}[${i}].naam=this.value">
                <input type="number" step="0.01" value="${item.prijs}" oninput="localData.assortiment[${cIdx}].${type}[${i}].prijs=parseFloat(this.value)">
            </div>
        `).join('');
    }

    function voegGroep() {
        if(!localData.assortiment) localData.assortiment = [];
        localData.assortiment.push({ categorie: "Nieuw", maten: [], smaken: [], toppings: [] });
        render();
    }

    function addItem(cIdx, type) {
        if(!localData.assortiment[cIdx][type]) localData.assortiment[cIdx][type] = [];
        localData.assortiment[cIdx][type].push({ naam: "Nieuw", prijs: 0 });
        render();
    }

    function secureSave() {
        const pw = prompt("Wachtwoord:");
        if (pw !== SLEUTEL) return alert("Fout wachtwoord!");

        // We bouwen een SCHOON object om te sturen
        const dataSturen = {
            admin_sleutel: SLEUTEL, // Moet op het hoogste niveau staan voor de Rules
            instellingen: {
                telefoon: document.getElementById('telefoon').value,
                rekeningnr: document.getElementById('iban').value,
                email: document.getElementById('email_instelling').value,
                winkel: document.getElementById('winkel_naam').value
            },
            assortiment: localData.assortiment || []
        };

        db.set(dataSturen)[cite: 1]
            .then(() => alert("✅ SUCCES: Alles staat live!"))
            .catch(err => alert("❌ FIREBASE WEIGERT: " + err.message));
    }
</script>
</body>
</html>
