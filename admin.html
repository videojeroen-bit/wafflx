<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wafflx Beheer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 800px; margin: auto; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .prod-group { border: 1px solid #444; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #252525; }
        .row { display: flex; gap: 10px; margin-bottom: 5px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-save { background: #2ecc71; color: white; width: 100%; font-size: 1.2rem; padding: 15px; margin-top: 20px; }
        .btn-add { background: #f1c40f; color: black; margin-bottom: 10px; }
        h3 { border-bottom: 1px solid #444; padding-bottom: 5px; color: #f1c40f; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ Wafflx Instellingen</h2>
    <div class="row">
        <div style="flex:1"><label>WhatsApp Nummer:</label><input type="text" id="telefoon"></div>
        <div style="flex:1"><label>IBAN (Rekeningnr):</label><input type="text" id="iban"></div>
    </div>

    <hr>
    <div id="assortiment-cont"></div>
    <button class="btn-add" onclick="voegProductGroep()">+ NIEUW PRODUCT (Bijv. Oliebollen)</button>

    <button class="btn-save" onclick="save()">💾 ALLES LIVE ZETTEN</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const config = { databaseURL: "https://wafflx-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const db = firebase.database().ref('/');
    let data = { instellingen: { telefoon: "", rekeningnr: "" }, assortiment: [] };

    db.on('value', snap => { if(snap.val()) { data = snap.val(); render(); } });

    function render() {
        document.getElementById('telefoon').value = data.instellingen.telefoon || "";
        document.getElementById('iban').value = data.instellingen.rekeningnr || "";
        const cont = document.getElementById('assortiment-cont');
        cont.innerHTML = '';

        data.assortiment.forEach((cat, cIdx) => {
            let html = `<div class="prod-group">
                <input type="text" value="${cat.categorie}" oninput="data.assortiment[${cIdx}].categorie=this.value" style="font-weight:bold; color:#f1c40f">
                <h3>Maten (M, L, XL...)</h3>
                ${renderLijst(cat.maten, cIdx, 'maten')}
                <button class="btn-add" onclick="addItem(${cIdx}, 'maten')">+ Maat</button>
                
                <h3>Smaken</h3>
                ${renderLijst(cat.smaken, cIdx, 'smaken')}
                <button class="btn-add" onclick="addItem(${cIdx}, 'smaken')">+ Smaak</button>

                <h3>Toppings</h3>
                ${renderLijst(cat.toppings, cIdx, 'toppings')}
                <button class="btn-add" onclick="addItem(${cIdx}, 'toppings')">+ Topping</button>
                <br><br>
                <button style="background:red; color:white" onclick="data.assortiment.splice(${cIdx},1);render()">VERWIJDER PRODUCTGROEP</button>
            </div>`;
            cont.innerHTML += html;
        });
    }

    function renderLijst(lijst, cIdx, type) {
        return (lijst || []).map((item, i) => `
            <div class="row">
                <input type="text" value="${item.naam}" oninput="data.assortiment[${cIdx}].${type}[${i}].naam=this.value">
                <input type="number" step="0.01" value="${item.prijs}" oninput="data.assortiment[${cIdx}].${type}[${i}].prijs=parseFloat(this.value)">
                <button style="background:#c0392b;color:white" onclick="data.assortiment[${cIdx}].${type}.splice(${i},1);render()">X</button>
            </div>
        `).join('');
    }

    function voegProductGroep() {
        data.assortiment.push({ categorie: "Nieuw", maten: [], smaken: [], toppings: [] });
        render();
    }

    function addItem(cIdx, type) {
        data.assortiment[cIdx][type].push({ naam: "Nieuw", prijs: 0 });
        render();
    }

    function save() {
        data.instellingen.telefoon = document.getElementById('telefoon').value;
        data.instellingen.rekeningnr = document.getElementById('iban').value;
        db.set(data).then(() => alert("✅ Database Bijgewerkt!"));
    }
</script>
</body>
</html>
