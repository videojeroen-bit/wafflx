<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wafflx Beheer - Alleen voor de Bakker</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 800px; margin: auto; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .prod-group { border: 1px solid #444; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #252525; }
        .row { display: flex; gap: 10px; margin-bottom: 5px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-save { background: #2ecc71; color: white; width: 100%; font-size: 1.2rem; padding: 15px; margin-top: 20px; }
        .btn-add { background: #f1c40f; color: black; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔐 Bakker Beheerpaneel</h1>
    <p>Alleen hier kunnen prijzen en producten worden aangepast.</p>
    
    <div class="row">
        <div style="flex:1"><label>WhatsApp Nummer:</label><input type="text" id="telefoon"></div>
        <div style="flex:1"><label>IBAN:</label><input type="text" id="iban"></div>
    </div>

    <hr>
    <div id="assortiment-cont"></div>
    <button class="btn-add" onclick="voegProductGroep()">+ NIEUWE GROEP</button>

    <button class="btn-save" onclick="secureSave()">💾 OVERSCHRIJVEN & LIVE ZETTEN</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const config = { databaseURL: "https://wafflx-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const db = firebase.database().ref('/');
    
    // HET WACHTWOORD
    const GEHEIM = "gamingopanl"; 

    let data = { instellingen: { telefoon: "", rekeningnr: "" }, assortiment: [] };

    db.on('value', snap => { if(snap.val()) { data = snap.val(); render(); } });

    function render() {
        document.getElementById('telefoon').value = data.instellingen.telefoon || "";
        document.getElementById('iban').value = data.instellingen.rekeningnr || "";
        const cont = document.getElementById('assortiment-cont');
        cont.innerHTML = '';

        data.assortiment.forEach((cat, cIdx) => {
            cont.innerHTML += `<div class="prod-group">
                <input type="text" value="${cat.categorie}" oninput="data.assortiment[${cIdx}].categorie=this.value" style="color:#f1c40f; font-size:1.2em;">
                <h3>Maten & Prijzen</h3>
                ${(cat.maten || []).map((m, i) => `
                    <div class="row">
                        <input type="text" value="${m.naam}" oninput="data.assortiment[${cIdx}].maten[${i}].naam=this.value">
                        <input type="number" step="0.01" value="${m.prijs}" oninput="data.assortiment[${cIdx}].maten[${i}].prijs=parseFloat(this.value)">
                    </div>
                `).join('')}
                <button class="btn-add" onclick="data.assortiment[${cIdx}].maten.push({naam:'Nieuw',prijs:0});render()">+ Maat</button>
                <br><br>
                <button style="background:red; color:white" onclick="data.assortiment.splice(${cIdx},1);render()">VERWIJDER GROEP</button>
            </div>`;
        });
    }

    function voegProductGroep() {
        data.assortiment.push({ categorie: "Nieuwe Groep", maten: [], smaken: [], toppings: [] });
        render();
    }

    function secureSave() {
        const pw = prompt("Admin Wachtwoord:");
        if (pw === GEHEIM) {
            // Voeg de admin sleutel tijdelijk toe aan de data voor de rules check
            data.admin_sleutel = "jouw_geheime_sleutel"; 
            
            db.set(data)
                .then(() => {
                    alert("✅ JSON succesvol overschreven!");
                })
                .catch(err => alert("Fout: Geen schrijfrechten! " + err.message));
        } else {
            alert("Kanker fout wachtwoord. Geen toegang.");
        }
    }
</script>
</body>
</html>
