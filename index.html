<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafflx - Bestellen</title>
    <style>
        :root { --accent: #f1c40f; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .step { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        h2 { color: var(--accent); margin-top: 0; font-size: 1.2rem; }
        
        /* De interactieve knoppen */
        .option-grid { display: grid; gap: 10px; }
        .opt { 
            background: #252525; padding: 15px; border-radius: 8px; cursor: pointer;
            display: flex; justify-content: space-between; border: 2px solid transparent; transition: 0.2s;
        }
        .opt:hover { background: #333; }
        .opt.selected { border-color: var(--accent); background: #2c2810; }
        .price { color: var(--accent); font-weight: bold; }
        
        .btn-order { 
            background: var(--accent); color: black; width: 100%; padding: 20px; 
            border: none; border-radius: 12px; font-size: 1.3rem; font-weight: bold; cursor: pointer; 
        }
        input { 
            width: 100%; padding: 12px; margin-bottom: 10px; background: #252525; 
            border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="step">
        <h2>Klantgegevens</h2>
        <input type="text" id="klant_naam" placeholder="Je naam...">
        <input type="text" id="klant_tel" placeholder="Je telefoonnummer...">
    </div>

    <div id="producten-lijst"></div>

    <div id="opties-sectie" style="display:none;">
        <div class="step">
            <h2>1. Kies je Maat</h2>
            <div id="maten-grid" class="option-grid"></div>
        </div>
        <div class="step">
            <h2>2. Kies je Smaak</h2>
            <div id="smaken-grid" class="option-grid"></div>
        </div>
        <div class="step">
            <h2>3. Extra Toppings</h2>
            <div id="toppings-grid" class="option-grid"></div>
        </div>
    </div>

    <button class="btn-order" onclick="verstuurBestelling()">🛒 BESTELLING OPSTUREN</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const config = { databaseURL: "https://wafflx-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const db = firebase.database().ref('/');

    let shopData = {};
    let selectie = { categorie: null, maat: null, smaak: null, toppings: [] };

    db.on('value', snap => {
        shopData = snap.val();
        renderCats();
    });

    function renderCats() {
        const cont = document.getElementById('producten-lijst');
        cont.innerHTML = '<div class="step"><h2>Product selecteren</h2><div class="option-grid" id="cat-grid"></div></div>';
        const grid = document.getElementById('cat-grid');
        
        shopData.assortiment.forEach((cat, idx) => {
            const div = document.createElement('div');
            div.className = 'opt' + (selectie.categorie === idx ? ' selected' : '');
            div.innerHTML = `<span>${cat.categorie}</span>`;
            div.onclick = () => selectCat(idx);
            grid.appendChild(div);
        });
    }

    function selectCat(idx) {
        selectie = { categorie: idx, maat: null, smaak: null, toppings: [] };
        document.getElementById('opties-sectie').style.display = 'block';
        renderOptions();
        renderCats();
    }

    function renderOptions() {
        const cat = shopData.assortiment[selectie.categorie];
        
        // Maten
        const mGrid = document.getElementById('maten-grid');
        mGrid.innerHTML = '';
        cat.maten.forEach(m => {
            const div = document.createElement('div');
            div.className = 'opt' + (selectie.maat?.naam === m.naam ? ' selected' : '');
            div.innerHTML = `<span>${m.naam}</span><span class="price">€${m.prijs.toFixed(2)}</span>`;
            div.onclick = () => { selectie.maat = m; renderOptions(); };
            mGrid.appendChild(div);
        });

        // Smaken
        const sGrid = document.getElementById('smaken-grid');
        sGrid.innerHTML = '';
        (cat.smaken || []).forEach(s => {
            const div = document.createElement('div');
            div.className = 'opt' + (selectie.smaak?.naam === s.naam ? ' selected' : '');
            div.innerHTML = `<span>${s.naam}</span><span class="price">+ €${s.prijs.toFixed(2)}</span>`;
            div.onclick = () => { selectie.smaak = s; renderOptions(); };
            sGrid.appendChild(div);
        });

        // Toppings (Meerdere keuzes mogelijk)
        const tGrid = document.getElementById('toppings-grid');
        tGrid.innerHTML = '';
        (cat.toppings || []).forEach(t => {
            const isSel = selectie.toppings.find(x => x.naam === t.naam);
            const div = document.createElement('div');
            div.className = 'opt' + (isSel ? ' selected' : '');
            div.innerHTML = `<span>${t.naam}</span><span class="price">+ €${t.prijs.toFixed(2)}</span>`;
            div.onclick = () => {
                if(isSel) selectie.toppings = selectie.toppings.filter(x => x.naam !== t.naam);
                else selectie.toppings.push(t);
                renderOptions();
            };
            tGrid.appendChild(div);
        });
    }

    function verstuurBestelling() {
        if(!selectie.maat) return alert("Kies eerst een maat!");
        const naam = document.getElementById('klant_naam').value;
        if(!naam) return alert("Vul je naam in!");

        let totaal = selectie.maat.prijs + (selectie.smaak?.prijs || 0);
        selectie.toppings.forEach(t => totaal += t.prijs);

        let tekst = `Hallo ${shopData.instellingen.winkel},\n\nBestelling van ${naam}:\n`;
        tekst += `- ${shopData.assortiment[selectie.categorie].categorie} (${selectie.maat.naam})\n`;
        if(selectie.smaak) tekst += `- Smaak: ${selectie.smaak.naam}\n`;
        if(selectie.toppings.length > 0) tekst += `- Toppings: ${selectie.toppings.map(t => t.naam).join(', ')}\n`;
        tekst += `\nTotaalbedrag: €${totaal.toFixed(2)}`;

        const url = `https://wa.me/${shopData.instellingen.telefoon}?text=${encodeURIComponent(tekst)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
