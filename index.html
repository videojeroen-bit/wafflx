<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafflx Bestelsysteem</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .step { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        h2 { color: #f1c40f; font-size: 1rem; margin-bottom: 10px; }
        select, input { 
            width: 100%; padding: 12px; background: #252525; border: 1px solid #444; 
            color: white; border-radius: 8px; font-size: 1rem; margin-bottom: 10px;
        }
        .multi-select { height: 100px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-add { background: #f1c40f; color: black; margin-bottom: 20px; }
        .btn-wa { background: #27ae60; color: white; }
        .btn-mail { background: #2980b9; color: white; }
        .btn-pdf { background: #e67e22; color: white; }
        
        .mandje-item { background: #252525; padding: 10px; border-radius: 6px; margin-bottom: 5px; border-left: 4px solid #f1c40f; position: relative; }
        .remove-item { position: absolute; right: 10px; top: 10px; color: #e74c3c; cursor: pointer; font-weight: bold; }
        
        #totaal { font-size: 1.4rem; color: #f1c40f; text-align: center; margin: 15px 0; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="step">
        <h2>Klantgegevens</h2>
        <input type="text" id="klant_naam" placeholder="Volledige naam...">
    </div>

    <div class="step">
        <h2>1. Kies Product</h2>
        <select id="select-cat" onchange="updateMaten()">
            <option value="">-- Selecteer --</option>
        </select>
        
        <div id="extra-opties" class="hidden">
            <h2>2. Kies Maat</h2>
            <select id="select-maat" onchange="updateSub()"></select>
            
            <h2>3. Kies Smaak</h2>
            <select id="select-smaak" onchange="updateSub()"></select>
            
            <h2>4. Toppings</h2>
            <select id="select-topping" class="multi-select" multiple onchange="updateSub()"></select>
            
            <button class="btn btn-add" onclick="voegToeAanMandje()">➕ VOEG TOE AAN MANDJE</button>
        </div>
    </div>

    <div id="mandje-sectie" class="step hidden">
        <h2>🛒 Jouw Mandje</h2>
        <div id="mandje-lijst"></div>
        <div id="totaal">Totaal: €0.00</div>
        
        <button class="btn btn-wa" onclick="verstuur('wa')">💬 BESTEL VIA WHATSAPP</button>
        <button class="btn btn-mail" onclick="verstuur('mail')">📧 BESTEL VIA E-MAIL</button>
        <button class="btn btn-pdf" onclick="downloadPDF()">📄 PDF FACTUUR</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const config = { databaseURL: "https://wafflx-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const db = firebase.database().ref('/');

    let shopData = {};
    let mandje = [];

    db.on('value', snap => {
        shopData = snap.val();
        const sel = document.getElementById('select-cat');
        sel.innerHTML = '<option value="">-- Selecteer --</option>';
        shopData.assortiment.forEach((item, i) => sel.innerHTML += `<option value="${i}">${item.categorie}</option>`);
    });

    function updateMaten() {
        const catIdx = document.getElementById('select-cat').value;
        if(!catIdx) return document.getElementById('extra-opties').classList.add('hidden');
        
        document.getElementById('extra-opties').classList.remove('hidden');
        const cat = shopData.assortiment[catIdx];
        
        const mSel = document.getElementById('select-maat');
        mSel.innerHTML = cat.maten.map((m, i) => `<option value="${i}">${m.naam} (€${m.prijs.toFixed(2)})</option>`).join('');
        
        const sSel = document.getElementById('select-smaak');
        sSel.innerHTML = (cat.smaken || []).map((s, i) => `<option value="${i}">${s.naam} (+€${s.prijs.toFixed(2)})</option>`).join('');
        
        const tSel = document.getElementById('select-topping');
        tSel.innerHTML = (cat.toppings || []).map((t, i) => `<option value="${i}">${t.naam} (+€${t.prijs.toFixed(2)})</option>`).join('');
    }

    function updateSub() { /* Visuele update indien nodig */ }

    function voegToeAanMandje() {
        const catIdx = document.getElementById('select-cat').value;
        const cat = shopData.assortiment[catIdx];
        const maat = cat.maten[document.getElementById('select-maat').value];
        const smaak = cat.smaken[document.getElementById('select-smaak').value];
        const tSel = document.getElementById('select-topping');
        const toppings = Array.from(tSel.selectedOptions).map(o => cat.toppings[o.value]);

        let prijs = maat.prijs + (smaak ? smaak.prijs : 0);
        toppings.forEach(t => prijs += t.prijs);

        mandje.push({
            naam: cat.categorie,
            details: `${maat.naam}, ${smaak ? smaak.naam : ''} ${toppings.map(t => t.naam).join(', ')}`,
            prijs: prijs
        });

        renderMandje();
    }

    function renderMandje() {
        const lijst = document.getElementById('mandje-lijst');
        const sectie = document.getElementById('mandje-sectie');
        lijst.innerHTML = '';
        let totaal = 0;

        mandje.forEach((item, i) => {
            totaal += item.prijs;
            lijst.innerHTML += `<div class="mandje-item">
                <strong>${item.naam}</strong><br><small>${item.details}</small><br>€${item.prijs.toFixed(2)}
                <span class="remove-item" onclick="verwijder(${i})">✖</span>
            </div>`;
        });

        document.getElementById('totaal').innerText = `Totaal: €${totaal.toFixed(2)}`;
        mandje.length > 0 ? sectie.classList.remove('hidden') : sectie.classList.add('hidden');
    }

    function verwijder(i) { mandje.splice(i, 1); renderMandje(); }

    function genereerBon() {
        const naam = document.getElementById('klant_naam').value || "Anoniem";
        let tekst = `Bestelling van ${naam}:\n\n`;
        mandje.forEach(item => tekst += `- ${item.naam} (${item.details}): €${item.prijs.toFixed(2)}\n`);
        tekst += `\n${document.getElementById('totaal').innerText}`;
        return tekst;
    }

    function verstuur(type) {
        const msg = genereerBon();
        if(type === 'wa') window.open(`https://wa.me/${shopData.instellingen.telefoon}?text=${encodeURIComponent(msg)}`);
        else window.location.href = `mailto:${shopData.instellingen.email}?subject=Bestelling&body=${encodeURIComponent(msg)}`;
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("WAFFLX FACTUUR", 10, 10);
        doc.text(genereerBon(), 10, 20);
        doc.save("Factuur.pdf");
    }
</script>
</body>
</html>
