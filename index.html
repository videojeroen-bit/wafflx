<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafflx Bestelsysteem</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .step { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        h2 { color: #f1c40f; font-size: 1rem; margin-bottom: 10px; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; background: #252525; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 10px; }
        .multi-select { height: 100px; }
        
        /* Knoppen */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; }
        .btn-add { background: #f1c40f; color: black; border: 2px solid #000; }
        .btn-wa { background: #27ae60; color: white; }
        .btn-mail { background: #2980b9; color: white; }
        .btn-pdf { background: #e67e22; color: white; }

        /* Mandje */
        .mandje-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid #f1c40f; position: relative; }
        .remove-btn { position: absolute; right: 10px; top: 10px; color: #ff4d4d; cursor: pointer; font-weight: bold; }
        #totaal-sectie { font-size: 1.6rem; color: #f1c40f; text-align: center; margin-top: 15px; font-weight: bold; border-top: 2px solid #333; padding-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="step">
        <h2>Klantgegevens</h2>
        <input type="text" id="klant_naam" placeholder="Je volledige naam...">
    </div>

    <div class="step">
        <h2>1. Kies Product</h2>
        <select id="sel-cat" onchange="toonOpties()"><option value="">-- Kies een wafel --</option></select>
        
        <div id="wafel-config" class="hidden">
            <h2>2. Kies Maat</h2>
            <select id="sel-maat"></select>
            <h2>3. Kies Smaak</h2>
            <select id="sel-smaak"></select>
            <h2>4. Toppings (Houd CTRL voor meer)</h2>
            <select id="sel-top" class="multi-select" multiple></select>
            
            <button class="btn btn-add" onclick="voegToe()">🛒 VOEG TOE AAN MANDJE</button>
        </div>
    </div>

    <div id="winkelmandje" class="step hidden">
        <h2>🛍️ Jouw Bestelling</h2>
        <div id="mandje-inhoud"></div>
        <div id="totaal-sectie">Totaal: €0.00</div>
        
        <button class="btn btn-wa" onclick="verzend('wa')">💬 VERZEND VIA WHATSAPP</button>
        <button class="btn btn-mail" onclick="verzend('mail')">📧 VERZEND VIA E-MAIL</button>
        <button class="btn btn-pdf" onclick="maakPDF()">📄 DOWNLOAD FACTUUR (PDF)</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const config = { databaseURL: "https://wafflx-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const db = firebase.database().ref('/');

    let data = {};
    let mandje = [];

    db.on('value', snap => {
        data = snap.val();
        const sc = document.getElementById('sel-cat');
        sc.innerHTML = '<option value="">-- Kies een wafel --</option>';
        data.assortiment.forEach((a, i) => sc.innerHTML += `<option value="${i}">${a.categorie}</option>`);
    });

    function toonOpties() {
        const idx = document.getElementById('sel-cat').value;
        const div = document.getElementById('wafel-config');
        if(!idx) return div.classList.add('hidden');
        div.classList.remove('hidden');

        const cat = data.assortiment[idx];
        document.getElementById('sel-maat').innerHTML = cat.maten.map((m, i) => `<option value="${i}">${m.naam} (€${m.prijs.toFixed(2)})</option>`).join('');
        document.getElementById('sel-smaak').innerHTML = cat.smaken.map((s, i) => `<option value="${i}">${s.naam} (+€${s.prijs.toFixed(2)})</option>`).join('');
        document.getElementById('sel-top').innerHTML = cat.toppings.map((t, i) => `<option value="${i}">${t.naam} (+€${t.prijs.toFixed(2)})</option>`).join('');
    }

    function voegToe() {
        const cIdx = document.getElementById('sel-cat').value;
        const cat = data.assortiment[cIdx];
        const m = cat.maten[document.getElementById('sel-maat').value];
        const s = cat.smaken[document.getElementById('sel-smaak').value];
        const tops = Array.from(document.getElementById('sel-top').selectedOptions).map(o => cat.toppings[o.value]);

        let prijs = m.prijs + s.prijs;
        tops.forEach(t => prijs += t.prijs);

        mandje.push({
            titel: cat.categorie,
            details: `${m.naam}, ${s.naam}${tops.length ? ' + ' + tops.map(t=>t.naam).join(', ') : ''}`,
            prijs: prijs
        });

        tekenMandje();
    }

    function verwijder(i) { mandje.splice(i, 1); tekenMandje(); }

    function tekenMandje() {
        const div = document.getElementById('mandje-inhoud');
        const sectie = document.getElementById('winkelmandje');
        div.innerHTML = '';
        let totaal = 0;

        mandje.forEach((item, i) => {
            totaal += item.prijs;
            div.innerHTML += `<div class="mandje-item">
                <strong>${item.titel}</strong><br><small>${item.details}</small><br>€${item.prijs.toFixed(2)}
                <span class="remove-btn" onclick="verwijder(${i})">✖</span>
            </div>`;
        });

        document.getElementById('totaal-sectie').innerText = `Totaal: €${totaal.toFixed(2)}`;
        mandje.length > 0 ? sectie.classList.remove('hidden') : sectie.classList.add('hidden');
    }

    function bouwTekst() {
        const naam = document.getElementById('naam').value || "Klant";
        let tekst = `Bestelling van ${naam}:\n\n`;
        mandje.forEach(it => tekst += `- ${it.titel}: ${it.details} (€${it.prijs.toFixed(2)})\n`);
        tekst += `\n${document.getElementById('totaal-sectie').innerText}`;
        return tekst;
    }

    function verzend(type) {
        const msg = bouwTekst();
        if(type === 'wa') window.open(`https://wa.me/${data.instellingen.telefoon}?text=${encodeURIComponent(msg)}`);
        else window.location.href = `mailto:${data.instellingen.email}?subject=Bestelling&body=${encodeURIComponent(msg)}`;
    }

    function maakPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("WAFFLX FACTUUR", 10, 10);
        doc.text(bouwTekst(), 10, 20);
        doc.save("Wafflx_Bestelling.pdf");
    }
</script>
</body>
</html>
