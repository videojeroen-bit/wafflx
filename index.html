<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafflx Bestellen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .step { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        h2 { color: #f1c40f; font-size: 1rem; margin-bottom: 10px; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; background: #252525; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; }
        .multi-select { height: 120px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; }
        .btn-add { background: #f1c40f; color: black; border: 2px solid #000; }
        .btn-wa { background: #27ae60; color: white; }
        .btn-mail { background: #2980b9; color: white; }
        .btn-pdf { background: #e67e22; color: white; }
        .mandje-item { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid #f1c40f; position: relative; }
        .remove-btn { position: absolute; right: 10px; top: 10px; color: #ff4d4d; cursor: pointer; font-weight: bold; }
        #totaal-sectie { font-size: 1.6rem; color: #f1c40f; text-align: center; margin-top: 15px; font-weight: bold; border-top: 2px solid #333; padding-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="step">
        <h2>Klantgegevens</h2>
        <input type="text" id="klant_naam" placeholder="Vul je naam in...">
    </div>

    <div class="step">
        <h2>1. Kies Product</h2>
        <select id="sel-cat" onchange="updateConfig()"><option value="">-- Selecteer --</option></select>
        
        <div id="wafel-opties" class="hidden">
            <h2>2. Maat</h2><select id="sel-maat"></select>
            <h2>3. Smaak</h2><select id="sel-smaak"></select>
            <h2>4. Toppings (Houd CTRL ingedrukt)</h2><select id="sel-top" class="multi-select" multiple></select>
            <button class="btn btn-add" onclick="voegToe()">➕ VOEG TOE AAN MANDJE</button>
        </div>
    </div>

    <div id="winkelmandje" class="step hidden">
        <h2>🛒 Jouw Mandje</h2>
        <div id="mandje-inhoud"></div>
        <div id="totaal-sectie">Totaal: €0.00</div>
        
        <button class="btn btn-wa" onclick="verzend('wa')">💬 WHATSAPP</button>
        <button class="btn btn-mail" onclick="verzend('mail')">📧 E-MAIL</button>
        <button class="btn btn-pdf" onclick="maakPDF()">📄 DOWNLOAD PDF</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const config = { databaseURL: "https://wafflx-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(config);
    const db = firebase.database().ref('/');

    let shopData = {};
    let mandje = [];

    db.on('value', snap => {
        shopData = snap.val();
        const sc = document.getElementById('sel-cat');
        sc.innerHTML = '<option value="">-- Kies een product --</option>';
        if(shopData.assortiment) {
            shopData.assortiment.forEach((a, i) => sc.innerHTML += `<option value="${i}">${a.categorie}</option>`);
        }
    });

    function updateConfig() {
        const idx = document.getElementById('sel-cat').value;
        const div = document.getElementById('wafel-opties');
        if(!idx) return div.classList.add('hidden');
        div.classList.remove('hidden');
        const cat = shopData.assortiment[idx];
        document.getElementById('sel-maat').innerHTML = (cat.maten || []).map((m, i) => `<option value="${i}">${m.naam} (€${parseFloat(m.prijs).toFixed(2)})</option>`).join('');
        document.getElementById('sel-smaak').innerHTML = (cat.smaken || []).map((s, i) => `<option value="${i}">${s.naam} (+€${parseFloat(s.prijs).toFixed(2)})</option>`).join('');
        document.getElementById('sel-top').innerHTML = (cat.toppings || []).map((t, i) => `<option value="${i}">${t.naam} (+€${parseFloat(t.prijs).toFixed(2)})</option>`).join('');
    }

    function voegToe() {
        const cIdx = document.getElementById('sel-cat').value;
        const cat = shopData.assortiment[cIdx];
        const m = cat.maten[document.getElementById('sel-maat').value];
        const s = cat.smaken[document.getElementById('sel-smaak').value];
        const tops = Array.from(document.getElementById('sel-top').selectedOptions).map(o => cat.toppings[o.value]);

        let prijs = parseFloat(m.prijs) + parseFloat(s.prijs);
        tops.forEach(t => prijs += parseFloat(t.prijs));

        mandje.push({
            naam: cat.categorie,
            details: `${m.naam}, ${s.naam}${tops.length ? ' + ' + tops.map(t=>t.naam).join(', ') : ''}`,
            prijs: prijs
        });
        tekenMandje();
    }

    function tekenMandje() {
        const div = document.getElementById('mandje-inhoud');
        const mDiv = document.getElementById('winkelmandje');
        div.innerHTML = '';
        let totaal = 0;
        mandje.forEach((it, i) => {
            totaal += it.prijs;
            div.innerHTML += `<div class="mandje-item"><strong>${it.naam}</strong><br><small>${it.details}</small><br>€${it.prijs.toFixed(2)}<span class="remove-btn" onclick="verwijder(${i})">✖</span></div>`;
        });
        document.getElementById('totaal-sectie').innerText = `Totaal: €${totaal.toFixed(2)}`;
        mandje.length > 0 ? mDiv.classList.remove('hidden') : mDiv.classList.add('hidden');
    }

    function verwijder(i) { mandje.splice(i, 1); tekenMandje(); }

    function bouwTekst() {
        const klant = document.getElementById('klant_naam').value || "Klant";
        let t = `Bestelling van ${klant}:\n\n`;
        mandje.forEach(it => t += `- ${it.naam}: ${it.details} (€${it.prijs.toFixed(2)})\n`);
        t += `\n${document.getElementById('totaal-sectie').innerText}`;
        return t;
    }

    function verzend(type) {
    // Gebruik de juiste functienaam
    const msg = bouwTekst(); 
    
    // Gebruik de juiste variabele naam (shopData in plaats van data)
    const inst = shopData.instellingen || {};
    
    // Haal de velden op zoals ze in je database staan[cite: 1]
    const mail = inst.email;
    const tel = inst.telefoon;

    if (type === 'wa') {
        if (!tel) return alert("FOUT: Geen telefoonnummer in database!");
        window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
    } else {
        if (!mail || mail.includes("voorbeeld.nl")) {
            return alert("FOUT: Geen geldig e-mailadres gevonden! Pas dit aan in admin_3.html[cite: 1]");
        }

        const mailtoLink = `mailto:${mail}?subject=Wafflx Bestelling&body=${encodeURIComponent(msg)}`;
        
        // Gebruik een onzichtbare link-klik om browser-blokkades te omzeilen
        const a = document.createElement('a');
        a.href = mailtoLink;
        a.click();
    }
}

    function maakPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("WAFFLX BESTELLING", 10, 10);
        doc.text(bouwTekst(), 10, 25);
        doc.save("Factuur_Wafflx.pdf");
    }
</script>
</body>
</html>
